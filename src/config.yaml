# IBVS Configuration File

# Maximum number of iterations for the servoing loop
max_iterations: 6

# Path to target image
target_image_path: "/home/khw/Documents/6dpose/dummy_tgt.JPG"

# Time step for control loop (seconds)
dt: 0.005

# Starting Gain parameter for control
K: 20

# Constant forward velocity when keypoints fail to match
constant_forward_vel: 2.5

# Maximum number of historical masks to keep in queue
historical_mask_queue: 5

# Scale factors for robot control velocities (translational)
x_scale: 10.0
y_scale: 10.0
z_scale: 10.0

# Scale factors for robot control velocities (rotational)
rx_scale: 10.0
ry_scale: 10.0
rz_scale: 10.0

# Grounded SAM 2 Configuration (for real.py)
# Text prompt for object detection (must be lowercase and end with a dot)
text_prompt: "object."

# Confidence thresholds for Grounded SAM 2
box_threshold: 0.35
text_threshold: 0.25

# Output directories for real.py
save_dir: "real_output"
historical_rgb_path: "real_historical"
